<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>PC Маркет</title>
<meta name="theme-color" content="#d2440a">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
/* Layout: sticky top bar, scrolling single column, fixed bottom tab bar, bottom sheets for details and pickers */
:root{
  --bg:#eef0f2; --surface:#ffffff; --surface2:#e4e8eb; --fg:#15181c; --muted:#56606a; --line:#d2d8dd;
  --accent:#d2440a; --accent-fg:#ffffff; --ok:#157347; --warn:#965800; --err:#c1272d;
  --tl:93%; --ti:34%; --navh:64px;
  --sans:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --mono:ui-monospace,"SF Mono","Roboto Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0f1215; --surface:#171b1f; --surface2:#20252a; --fg:#e9ecef; --muted:#98a2ac; --line:#2b323a;
    --accent:#ff7d45; --accent-fg:#1c0c04; --ok:#4cc38a; --warn:#e8a63f; --err:#ff7070; --tl:20%; --ti:72%;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0f1215; --surface:#171b1f; --surface2:#20252a; --fg:#e9ecef; --muted:#98a2ac; --line:#2b323a;
  --accent:#ff7d45; --accent-fg:#1c0c04; --ok:#4cc38a; --warn:#e8a63f; --err:#ff7070; --tl:20%; --ti:72%;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{height:100%}
body{margin:0;min-height:100%;background:var(--bg);color:var(--fg);font:15px/1.45 var(--sans);-webkit-text-size-adjust:100%}
body.lock{overflow:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3,p{margin:0}
h1{font-size:1.35rem;line-height:1.2;letter-spacing:-.01em}
h2{font-size:1.15rem;line-height:1.25}
h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:700}
.wrap{max-width:760px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.sm{font-size:.82rem}
.nowrap{white-space:nowrap}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
.top .wrap{display:flex;align-items:center;gap:10px;height:56px}
.brand{display:flex;align-items:center;gap:9px;font-weight:800;font-size:1.08rem;letter-spacing:-.01em;margin-right:auto}
.logo{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center}
.ib{position:relative;width:44px;height:44px;border-radius:12px;border:0;background:transparent;display:grid;place-items:center;cursor:pointer}
.ib:active{background:var(--surface2)}
.badge{position:absolute;top:4px;right:2px;min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--accent);color:var(--accent-fg);font:700 .7rem/18px var(--mono);text-align:center}
.badge:empty{display:none}

/* nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .wrap{display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
.nav button{border:0;background:none;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.68rem;font-weight:600;color:var(--muted);cursor:pointer;min-width:0}
.nav button[aria-current="page"]{color:var(--accent)}
main{padding-top:14px;padding-bottom:calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
main.has-bar{padding-bottom:calc(var(--navh) + 96px + env(safe-area-inset-bottom,0px))}
.stack{display:flex;flex-direction:column;gap:14px}
.sec-h{display:flex;align-items:center;justify-content:space-between;gap:10px}

/* controls */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:7px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid transparent;background:var(--accent);color:var(--accent-fg);font-weight:700;cursor:pointer;text-align:center}
.btn:active{filter:brightness(.92)}
.btn.sec{background:var(--surface);color:var(--fg);border-color:var(--line)}
.btn.ghost{background:transparent;color:var(--fg);border-color:var(--line)}
.btn.s{min-height:38px;padding:0 12px;font-size:.88rem;border-radius:10px}
.btn.block{width:100%}
.btn.danger{background:transparent;color:var(--err);border-color:var(--err)}
.btn[disabled]{opacity:.5;pointer-events:none}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field>span{font-size:.78rem;font-weight:700;color:var(--muted)}
input[type=text],input[type=search],input[type=tel],input[type=number],select,textarea{width:100%;min-height:44px;padding:9px 12px;border-radius:12px;border:1px solid var(--line);background:var(--surface);min-width:0}
textarea{min-height:84px;resize:vertical}
input[type=range]{width:100%;accent-color:var(--accent)}
.search{position:relative}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);color:var(--muted);pointer-events:none}
.search input{padding-left:40px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 0 4px;scrollbar-width:none;margin:0 -16px;padding-left:16px;padding-right:16px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:19px;border:1px solid var(--line);background:var(--surface);font-size:.88rem;font-weight:600;cursor:pointer;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.row{display:flex;gap:10px;align-items:center}
.row.wrap2{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.check{display:flex;align-items:center;gap:10px;min-height:44px;cursor:pointer}
.check input{width:22px;height:22px;accent-color:var(--accent);flex:none}

/* tiles */
.tile{display:grid;place-items:center;border-radius:12px;background:hsl(var(--h) 55% var(--tl));color:hsl(var(--h) 60% var(--ti));flex:none}
.t-cpu{--h:18}.t-mb{--h:150}.t-ram{--h:200}.t-gpu{--h:275}.t-ssd{--h:215}.t-hdd{--h:40}.t-cooler{--h:185}.t-psu{--h:50}.t-case{--h:330}

/* product grid */
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:10px}
.pc{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0;cursor:pointer}
.pc .tile{height:76px;position:relative}
.tag{position:absolute;left:6px;top:6px;font-size:.66rem;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 6px;border-radius:5px;background:var(--fg);color:var(--bg)}
.tag.sale{background:var(--accent);color:var(--accent-fg)}
.brand-l{font:700 .68rem var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.pname{font-weight:700;font-size:.9rem;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.pspec{font-size:.76rem;color:var(--muted);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.3em}
.price{font:700 1rem var(--mono);white-space:nowrap}
.old{font:.75rem var(--mono);color:var(--muted);text-decoration:line-through;white-space:nowrap}
.pfoot{display:flex;align-items:center;gap:6px;margin-top:auto}
.pfoot .btn{flex:1}
.hbtn{width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;cursor:pointer;flex:none}
.hbtn[aria-pressed="true"]{color:var(--accent);border-color:var(--accent)}
.hbtn[aria-pressed="true"] svg{fill:currentColor}
.stock{font-size:.72rem;font-weight:700}
.stock.in{color:var(--ok)}.stock.order{color:var(--warn)}

/* list rows */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:12px;align-items:center;padding:12px;border-bottom:1px solid var(--line);min-width:0;cursor:pointer;background:none;border-left:0;border-right:0;border-top:0;text-align:left;width:100%}
.li:last-child{border-bottom:0}
.li .tile{width:48px;height:48px}
.li.dis{opacity:.55}
.li-t{font-weight:700;font-size:.92rem;line-height:1.25;overflow-wrap:anywhere}
.li-s{font-size:.78rem;color:var(--muted);overflow-wrap:anywhere}
.why{font-size:.76rem;color:var(--err);font-weight:600}

/* builder */
.score{padding:14px;display:flex;flex-direction:column;gap:10px}
.bar{display:grid;grid-template-columns:78px 1fr 34px;align-items:center;gap:10px;font-size:.8rem}
.bar i{display:block;height:8px;border-radius:4px;background:var(--surface2);overflow:hidden}
.bar b{display:block;height:100%;background:var(--accent);border-radius:4px}
.bar span{font-family:var(--mono);text-align:right}
.bar span:first-child{font-family:var(--sans);text-align:left;color:var(--muted);font-weight:600}
.slot{display:flex;align-items:center;gap:12px;padding:10px 12px;border-bottom:1px solid var(--line);cursor:pointer;width:100%;background:none;border-top:0;border-left:0;border-right:0;text-align:left;min-width:0}
.slot:last-child{border-bottom:0}
.slot .tile{width:44px;height:44px;opacity:.9}
.slot.vac .tile{background:transparent;border:1.5px dashed var(--line);color:var(--muted)}
.slot.bad{background:color-mix(in srgb,var(--err) 9%,transparent)}
.slot-n{font-size:.72rem;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.slot-v{font-weight:700;font-size:.9rem;line-height:1.25;overflow-wrap:anywhere}
.slot-add{color:var(--accent);font-weight:700;font-size:.9rem}
.rm{width:36px;height:36px;border-radius:10px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;flex:none;cursor:pointer}
.ck{display:flex;gap:10px;padding:9px 12px;align-items:flex-start;font-size:.86rem;border-bottom:1px solid var(--line)}
.ck:last-child{border-bottom:0}
.ck svg{flex:none;margin-top:2px}
.ck.ok svg{color:var(--ok)}.ck.warn svg{color:var(--warn)}.ck.err svg{color:var(--err)}.ck.info svg,.ck.todo svg{color:var(--muted)}
.ck.err{font-weight:600}
.buybar{position:fixed;left:0;right:0;bottom:calc(var(--navh) + env(safe-area-inset-bottom,0px));z-index:15;background:var(--surface);border-top:1px solid var(--line);box-shadow:0 -6px 18px rgba(0,0,0,.08)}
.buybar .wrap{display:flex;align-items:center;gap:12px;padding-top:10px;padding-bottom:10px}
.st{font-size:.76rem;font-weight:700;display:flex;align-items:center;gap:5px}
.st.ok{color:var(--ok)}.st.warn{color:var(--warn)}.st.err{color:var(--err)}.st.todo{color:var(--muted)}
.total{font:800 1.2rem var(--mono);white-space:nowrap}

/* presets */
.preset{padding:14px;display:flex;flex-direction:column;gap:10px}
.pill{display:inline-block;font-size:.72rem;font-weight:700;padding:3px 9px;border-radius:10px;background:var(--surface2);color:var(--muted)}
.parts{display:flex;flex-direction:column;gap:3px;font-size:.8rem;color:var(--muted)}
.parts div{display:flex;gap:8px;justify-content:space-between}
.parts span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.opts{display:flex;gap:8px;flex-wrap:wrap}

/* used */
.fab{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));z-index:14;min-height:52px;border-radius:26px;box-shadow:0 6px 18px rgba(0,0,0,.25);padding:0 20px}
.cond{display:inline-block;font-size:.7rem;font-weight:800;padding:2px 8px;border-radius:8px;border:1px solid currentColor}
.cond.c0{color:var(--ok)}.cond.c1{color:var(--ok)}.cond.c2{color:var(--warn)}.cond.c3{color:var(--err)}
.note{padding:12px 14px;border-radius:12px;background:var(--surface2);font-size:.84rem;color:var(--muted)}

/* sheet */
.sheet{position:fixed;inset:0;z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.scrim{position:absolute;inset:0;background:rgba(5,8,10,.55)}
.panel{position:relative;width:100%;max-width:760px;max-height:92%;overflow-y:auto;overscroll-behavior:contain;background:var(--bg);border-radius:20px 20px 0 0;padding:8px max(16px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .22s ease-out}
@keyframes up{from{transform:translateY(40px);opacity:0}to{transform:none;opacity:1}}
.grab{width:40px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 10px}
.sh-h{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}
.specs{display:grid;grid-template-columns:auto 1fr;gap:0;margin:0}
.specs dt,.specs dd{margin:0;padding:9px 0;border-bottom:1px solid var(--line);font-size:.88rem}
.specs dt{color:var(--muted);padding-right:16px}
.specs dd{font-weight:600;text-align:right;overflow-wrap:anywhere}
.det-tile{height:110px;border-radius:14px;display:grid;place-items:center}
.qty{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.qty button{width:38px;height:38px;border:0;background:none;font-size:1.2rem;cursor:pointer}
.qty span{min-width:26px;text-align:center;font:700 .9rem var(--mono)}
.sumrow{display:flex;justify-content:space-between;gap:10px;padding:4px 0}
.sumrow.big{font-weight:800;font-size:1.1rem;border-top:1px solid var(--line);padding-top:10px;margin-top:6px}
.seg{display:flex;background:var(--surface2);border-radius:12px;padding:3px;gap:3px;overflow-x:auto;scrollbar-width:none}
.seg::-webkit-scrollbar{display:none}
.seg button{flex:1;min-height:38px;padding:0 12px;border:0;border-radius:9px;background:none;font-weight:700;font-size:.84rem;color:var(--muted);cursor:pointer;white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.empty{padding:36px 16px;text-align:center;color:var(--muted)}
.empty svg{opacity:.6;margin-bottom:8px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 84px + env(safe-area-inset-bottom,0px));z-index:60;max-width:min(92vw,420px);background:var(--fg);color:var(--bg);padding:11px 16px;border-radius:12px;font-weight:600;font-size:.88rem;opacity:0;pointer-events:none;transition:opacity .2s;text-align:center}
#toast.on{opacity:1}
@media (min-width:700px){.pgrid{grid-template-columns:repeat(auto-fill,minmax(176px,1fr))}}
@media (prefers-reduced-motion:reduce){.panel{animation:none}#toast{transition:none}}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><span class="logo" id="logo"></span><span>PC Маркет</span></div>
  <button class="ib" data-act="theme" aria-label="Сменить тему" id="themeBtn"></button>
  <button class="ib" data-act="tab" data-v="cart" aria-label="Корзина" id="cartBtn"><span class="badge" id="cartBadge"></span></button>
</div></header>
<main class="wrap" id="view"></main>
<nav class="nav" aria-label="Разделы"><div class="wrap" id="nav"></div></nav>
<div class="sheet" id="sheet" hidden><div class="scrim" data-act="close"></div><div class="panel" role="dialog" aria-modal="true"><div class="grab"></div><div id="sheetBody"></div></div></div>
<div id="toast" role="status" aria-live="polite"></div>

<script>
'use strict';
/* ============================ DATA ============================ */
const CATS=[
 {id:'cpu',n:'Процессоры',s:'Процессор'},
 {id:'mb',n:'Материнские платы',s:'Мат. плата'},
 {id:'ram',n:'Оперативная память',s:'Память'},
 {id:'gpu',n:'Видеокарты',s:'Видеокарта'},
 {id:'ssd',n:'SSD',s:'SSD'},
 {id:'hdd',n:'HDD',s:'HDD'},
 {id:'cooler',n:'Охлаждение',s:'Кулер'},
 {id:'psu',n:'Блоки питания',s:'Блок питания'},
 {id:'case',n:'Корпуса',s:'Корпус'}
];
const REQ=['cpu','mb','ram','ssd','psu','case'];
const catById=Object.fromEntries(CATS.map(c=>[c.id,c]));
const P=[],cnt={};
function A(cat,brand,name,price,o){cnt[cat]=(cnt[cat]||0)+1;P.push(Object.assign({id:cat+cnt[cat],cat,brand,name,price,st:'in'},o));}
const ALL_S=['AM4','AM5','LGA1700','LGA1851'];
/* CPU: s сокет, c ядра, t потоки, f частота, w потребление, perf оценка 0-100, ig встроенная графика */
A('cpu','AMD','Ryzen 5 5500',42000,{s:'AM4',c:6,t:12,f:4.2,w:65,perf:38,ig:0});
A('cpu','AMD','Ryzen 5 5600',52000,{s:'AM4',c:6,t:12,f:4.4,w:65,perf:44,ig:0});
A('cpu','AMD','Ryzen 7 5700X3D',105000,{s:'AM4',c:8,t:16,f:4.1,w:105,perf:62,ig:0,hit:1});
A('cpu','AMD','Ryzen 5 7500F',78000,{s:'AM5',c:6,t:12,f:5.0,w:65,perf:55,ig:0});
A('cpu','AMD','Ryzen 5 7600',95000,{s:'AM5',c:6,t:12,f:5.1,w:65,perf:58,ig:1});
A('cpu','AMD','Ryzen 7 7700',140000,{s:'AM5',c:8,t:16,f:5.3,w:65,perf:66,ig:1});
A('cpu','AMD','Ryzen 7 7800X3D',215000,{s:'AM5',c:8,t:16,f:5.0,w:120,perf:82,ig:1,hit:1});
A('cpu','AMD','Ryzen 7 9800X3D',280000,{s:'AM5',c:8,t:16,f:5.2,w:120,perf:92,ig:1,hit:1});
A('cpu','AMD','Ryzen 9 9950X',260000,{s:'AM5',c:16,t:32,f:5.7,w:170,perf:95,ig:1,old:295000});
A('cpu','Intel','Core i3-12100F',38000,{s:'LGA1700',c:4,t:8,f:4.3,w:60,perf:30,ig:0});
A('cpu','Intel','Core i5-12400F',55000,{s:'LGA1700',c:6,t:12,f:4.4,w:65,perf:45,ig:0,hit:1});
A('cpu','Intel','Core i5-13400F',85000,{s:'LGA1700',c:10,t:16,f:4.6,w:65,perf:56,ig:0});
A('cpu','Intel','Core i5-14600K',150000,{s:'LGA1700',c:14,t:20,f:5.3,w:181,perf:74,ig:1});
A('cpu','Intel','Core i7-14700K',215000,{s:'LGA1700',c:20,t:28,f:5.6,w:253,perf:84,ig:1,old:239000});
A('cpu','Intel','Core i9-14900K',290000,{s:'LGA1700',c:24,t:32,f:6.0,w:253,perf:90,ig:1});
A('cpu','Intel','Core Ultra 5 245K',135000,{s:'LGA1851',c:14,t:14,f:5.2,w:159,perf:70,ig:1});
A('cpu','Intel','Core Ultra 7 265K',195000,{s:'LGA1851',c:20,t:20,f:5.5,w:250,perf:83,ig:1});
/* Материнские платы: s сокет, ram тип памяти, ff формат */
A('mb','ASRock','A520M-HVS',28000,{s:'AM4',ram:'DDR4',ff:'mATX',chip:'A520'});
A('mb','MSI','B550M PRO-VDH WiFi',48000,{s:'AM4',ram:'DDR4',ff:'mATX',chip:'B550'});
A('mb','Gigabyte','B550 AORUS Elite V2',68000,{s:'AM4',ram:'DDR4',ff:'ATX',chip:'B550'});
A('mb','ASRock','A620M-HDV/M.2+',45000,{s:'AM5',ram:'DDR5',ff:'mATX',chip:'A620'});
A('mb','MSI','PRO B650M-P',62000,{s:'AM5',ram:'DDR5',ff:'mATX',chip:'B650',hit:1});
A('mb','ASUS','TUF GAMING B650-PLUS WiFi',105000,{s:'AM5',ram:'DDR5',ff:'ATX',chip:'B650'});
A('mb','Gigabyte','X870 AORUS Elite WiFi7',160000,{s:'AM5',ram:'DDR5',ff:'ATX',chip:'X870'});

 if(o.cpu&&o.mb){o.cpu.s===o.mb.s?add('ok','Сокет '+o.cpu.s+': процессор и плата подходят друг другу',['cpu','mb']):add('err','Процессор на сокет '+o.cpu.s+', а плата на '+o.mb.s,['cpu','mb']);}
 if(o.mb&&o.ram){o.ram.type===o.mb.ram?add('ok','Память '+o.ram.type+' подходит к плате',['ram','mb']):add('err','Плата работает с '+o.mb.ram+', а выбрана память '+o.ram.type,['ram','mb']);}
 if(o.mb&&o.case){o.case.ff.includes(o.mb.ff)?add('ok','Плата '+o.mb.ff+' помещается в корпус',['mb','case']):add('err','Плата '+o.mb.ff+' не помещается в корпус (он на '+o.case.ff.join(', ')+')',['mb','case']);}
 if(o.gpu&&o.case){o.gpu.len<=o.case.maxGpu?add('ok','Видеокарта '+o.gpu.len+' мм, корпус принимает до '+o.case.maxGpu+' мм',['gpu','case']):add('err','Видеокарта '+o.gpu.len+' мм длиннее, чем помещается в корпус ('+o.case.maxGpu+' мм)',['gpu','case']);}
 if(o.cooler&&o.cpu){
  o.cooler.sockets.includes(o.cpu.s)?add('ok','Кулер крепится на сокет '+o.cpu.s,['cooler','cpu']):add('err','Кулер не подходит к сокету '+o.cpu.s,['cooler','cpu']);
  if(o.cooler.tdp<o.cpu.w)add('warn','Кулер рассчитан на '+o.cooler.tdp+' Вт, а процессору нужно около '+o.cpu.w+' Вт: будет шумно или упрётся в нагрев',['cooler','cpu']);
 }
 if(o.cooler&&o.case){
  if(o.cooler.kind==='air'){o.cooler.h<=o.case.maxCool?add('ok','Кулер '+o.cooler.h+' мм помещается (лимит корпуса '+o.case.maxCool+' мм)',['cooler','case']):add('err','Кулер высотой '+o.cooler.h+' мм не влезет в корпус (лимит '+o.case.maxCool+' мм)',['cooler','case']);}
  else{o.cooler.rad<=o.case.rad?add('ok','Радиатор '+o.cooler.rad+' мм поддерживается корпусом',['cooler','case']):add('err','Корпус не принимает радиатор '+o.cooler.rad+' мм (максимум '+o.case.rad+' мм)',['cooler','case']);}
 }
 if(o.psu&&o.case){o.case.psu.includes(o.psu.ff)?0:add('err','Блок питания формата '+o.psu.ff+' не подходит к этому корпусу',['psu','case']);}
 if(o.psu&&draw(o)>0){
  const d=draw(o),r=recW(o);
  if(o.psu.w>=r)add('ok','Блок питания '+o.psu.w+' Вт: запас достаточный (нагрузка до '+d+' Вт)',['psu']);
  else if(o.psu.w>=d)add('warn','Блока питания '+o.psu.w+' Вт хватит впритык, лучше от '+r+' Вт',['psu']);
  else add('err','Блок питания '+o.psu.w+' Вт слабый: нагрузка до '+d+' Вт, берите от '+r+' Вт',['psu']);
 }
 if(o.cpu&&!o.gpu){o.cpu.ig?add('info','Видеокарты нет: графику даёт процессор, этого хватит для офиса и видео',['gpu']):add('warn','У процессора нет встроенной графики, нужна видеокарта',['gpu','cpu']);}
 if(o.ram&&o.ram.k===1)add('warn','Одна планка памяти: работает медленнее, лучше две',['ram']);
 if(o.hdd&&!o.ssd)add('warn','Только HDD: система будет загружаться медленно, добавьте SSD',['ssd']);
 if(o.cpu&&o.gpu){
  if(o.gpu.perf-o.cpu.perf>35)add('warn','Процессор слабоват для такой видеокарты: в играх она не раскроется',['cpu','gpu']);
  else if(o.cpu.perf-o.gpu.perf>45)add('info','Видеокарта заметно слабее процессора: для игр выгоднее вложиться в неё',['gpu']);
 }
 const miss=REQ.filter(k=>!o[k]);
 if(miss.length&&miss.length<REQ.length)add('todo','Не выбрано: '+miss.map(k=>catById[k].s.toLowerCase()).join(', '),miss);
 return L;
}
const errs=o=>checks(o).filter(c=>c.lvl==='err').map(c=>c.t);
function okWith(cat,p,b){
 const cur=new Set(errs(objs(b)));const nb=Object.assign({},b);nb[cat]=p.id;
 return errs(objs(nb)).filter(t=>!cur.has(t));
}
function tier(g,has){
 if(!has)return g?'Офис, видео и лёгкие игры':'Нужна видеокарта';
 if(g>=85)return'4K на ультра';if(g>=70)return'4K / 1440p высокие';if(g>=55)return'1440p высокие';
 if(g>=38)return'Full HD высокие';if(g>=20)return'Full HD средние';return'Лёгкие игры';
}
function scores(o){
 const g=o.gpu?o.gpu.perf:(o.cpu&&o.cpu.ig?8:0),c=o.cpu?o.cpu.perf:0;
 const ramc=o.ram?Math.min(100,o.ram.cap/64*100):0;
 return{game:o.cpu?Math.round(g*.7+c*.3):0,work:o.cpu?Math.round(c*.6+ramc*.15+(o.gpu?o.gpu.perf*.25:0)):0,tier:tier(g,!!o.gpu)};
}
function status(o){
 const ch=checks(o),e=ch.filter(c=>c.lvl==='err').length,w=ch.filter(c=>c.lvl==='warn').length,m=REQ.filter(k=>!o[k]).length;
 if(!Object.keys(o).length)return{k:'todo',t:'Пока пусто'};
 if(e)return{k:'err',t:'Конфликтов: '+e};
 if(m)return{k:'todo',t:'Не выбрано: '+m};
 if(w)return{k:'warn',t:'Замечаний: '+w};
 return{k:'ok',t:'Всё совместимо'};
}

/* Автоподбор по бюджету */
function autoBuild(budget,purpose,plat,compact){
 const share={
  game:{cpu:.2,mb:.1,ram:.07,gpu:.38,ssd:.07,psu:.07,case:.06,cooler:.05},
  work:{cpu:.3,mb:.12,ram:.12,gpu:.2,ssd:.09,psu:.06,case:.06,cooler:.05},
  office:{cpu:.28,mb:.14,ram:.12,gpu:0,ssd:.12,psu:.08,case:.12,cooler:.04}
 }[purpose];
 const isITXcase=p=>p.ff.length===1&&p.ff[0]==='ITX';
 const pool=cat=>P.filter(p=>p.cat===cat).filter(p=>{
  if(cat==='cpu'){if(plat==='amd'&&!p.s.startsWith('AM'))return false;if(plat==='intel'&&!p.s.startsWith('LGA'))return false;if(purpose==='office'&&!p.ig)return false;}
  if(cat==='mb'){if(plat==='amd'&&!p.s.startsWith('AM'))return false;if(plat==='intel'&&!p.s.startsWith('LGA'))return false;return compact?p.ff==='ITX':p.ff!=='ITX';}
  if(cat==='case')return compact?isITXcase(p):!isITXcase(p);
  if(cat==='psu')return compact?p.ff==='SFX':p.ff==='ATX';
  if(cat==='ram')return p.k>=2;
  if(cat==='ssd')return p.kind==='NVMe'&&p.cap>=500;
  return true;
 }).sort((a,b)=>a.price-b.price);
 let b={};
 const fits=(cat,p)=>okWith(cat,p,b).length===0;
 const pick=(cat,sh)=>{
  const l=pool(cat).filter(p=>fits(cat,p));if(!l.length)return;
  const within=l.filter(p=>p.price<=sh);b[cat]=(within.length?within[within.length-1]:l[0]).id;
 };
 const fixPsu=()=>{
  const o=objs(b);delete b.psu;const r=recW(o);
  const l=pool('psu').filter(p=>fits('psu',p)&&p.w>=r);
  if(l.length)b.psu=l[0].id;else{const l2=pool('psu').filter(p=>fits('psu',p));if(l2.length)b.psu=l2[l2.length-1].id;}
 };
 pick('cpu',budget*share.cpu);pick('mb',budget*share.mb);pick('ram',budget*share.ram);
 if(share.gpu)pick('gpu',budget*share.gpu);
 pick('ssd',budget*share.ssd);fixPsu();
 /* корпус и кулер подбираем так, чтобы всё влезло */
 pick('case',budget*share.case);
 const cpu=byId[b.cpu];
 {const l=pool('cooler').filter(p=>fits('cooler',p));const good=l.filter(p=>!cpu||p.tdp>=cpu.w);const base=good.length?good:l;
  if(base.length){const within=base.filter(p=>p.price<=budget*share.cooler);b.cooler=(within.length?within[within.length-1]:base[0]).id;}}
 const tot=()=>total(objs(b));
 /* если дорого: понижаем самое дорогое */
 for(let i=0;i<24&&tot()>budget;i++){
  const order=['gpu','cpu','mb','ram','ssd','case','cooler'].filter(k=>b[k]).sort((x,y)=>byId[b[y]].price-byId[b[x]].price);
  let done=false;
  for(const k of order){
   const cur=byId[b[k]],l=pool(k).filter(p=>p.price<cur.price&&fits(k,p));
   if(l.length){const prev=Object.assign({},b);b[k]=l[l.length-1].id;fixPsu();if(tot()<total(objs(prev))){done=true;break}b=prev;}
  }
  if(!done)break;
 }
 /* если остались деньги: улучшаем */
 const up=purpose==='office'?['cpu','ram','ssd','cooler','case','mb']:['gpu','cpu','ram','ssd','cooler','case','mb'];
 for(let i=0;i<30;i++){
  let done=false;
  for(const k of up){
   if(!b[k])continue;const cur=byId[b[k]];
   const l=pool(k).filter(p=>p.price>cur.price&&fits(k,p));
   for(const p of l){
    const prev=Object.assign({},b);b[k]=p.id;fixPsu();
    if(b.psu&&tot()<=budget){done=true;break}
    b=prev;
   }
   if(done)break;
  }
  if(!done)break;
 }
 return b;
}

function priceHint(title,cond){
 const t=(title||'').toLowerCase().trim();if(t.length<3)return '';
 const words=t.split(/[\s,]+/).filter(w=>w.length>2);
 const nums=words.filter(w=>/\d/.test(w));
 if(!nums.length)return '';
 let best=null,sc=0;
 for(const p of P){const n=nm(p).toLowerCase();if(!nums.every(w=>n.includes(w)))continue;let s=0;for(const w of words)if(n.includes(w))s++;if(s>sc){sc=s;best=p}}
 if(!best||sc<2)return '';
 const f=(CONDS.find(c=>c[0]===cond)||CONDS[1])[1];
 return 'Новый «'+nm(best)+'» стоит '+fmt(best.price)+'. Для состояния «'+cond+'» ориентир: '+fmt(Math.round(best.price*f*.9/1000)*1000)+' – '+fmt(Math.round(best.price*f*1.05/1000)*1000);
}

 stock:t=>{C.stock=t.checked;render()},

 ucond:t=>{U.cond=t.value;render()},ucity:t=>{U.city=t.value;render()},usort:t=>{U.sort=t.value;render()},
 'ab-compact':t=>{AB.compact=t.checked;AB.res=null;$('#autoRes').innerHTML=''},
 promo:()=>render(),
 svc:t=>{S.svc[t.dataset.id]=t.checked;save();render()},
 del:t=>{S.del=t.value;save();render()},
 pay:t=>{S.pay=t.value;save()},
 theme:t=>{S.theme=t.value;save();applyTheme()},
 psort:t=>{PK.sort=t.value;refreshSheet()},
 ponly:t=>{PK.only=t.checked;refreshSheet()},
 'ul-cond':()=>updHint()
};
document.addEventListener('input',e=>{const t=e.target.closest('[data-in]');if(t&&INP[t.dataset.in])INP[t.dataset.in](t,e)});
document.addEventListener('change',e=>{const t=e.target.closest('[data-ch]');if(t&&CHG[t.dataset.ch])CHG[t.dataset.ch](t,e)});
document.addEventListener('submit',e=>{
 if(e.target.id!=='uform')return;e.preventDefault();
 const g=id=>$('#'+id).value.trim();
 const title=g('ul-title'),price=parseInt(g('ul-price'),10),phone=g('ul-phone');
 if(title.length<3){toast('Укажите название');return}
 if(!(price>0)){toast('Укажите цену');return}
 if(digits(phone).length<10){toast('Укажите телефон полностью');return}
 S.me.phone=phone;S.me.city=g('ul-city');
 S.listings.unshift({id:'m'+Date.now().toString(36),cat:g('ul-cat'),title,price,cond:g('ul-cond'),age:g('ul-age'),war:g('ul-war'),city:g('ul-city'),seller:S.me.name||'Вы',phone,desc:g('ul-desc'),ts:Date.now()});
 save();U={cat:'all',q:'',cond:'all',city:'all',sort:'new',mine:false};closeSheet();toast('Объявление опубликовано на этом телефоне');
 if(T!=='used')setTab('used');else render();
});
window.addEventListener('beforeinstallprompt',e=>{e.preventDefault();deferredPrompt=e;if(T==='profile')render()});

/* ============================ START ============================ */
(function init(){
 try{const q=new URLSearchParams(location.search).get('tab');if(q&&VIEWS[q])T=q}catch(e){}
 try{history.replaceState({t:T},'')}catch(e){}
 render();
 if('serviceWorker' in navigator&&/^https?:$/.test(location.protocol)){
  /*__SW__*/navigator.serviceWorker.register('sw.js').catch(()=>{});
 }
})();
</script>
